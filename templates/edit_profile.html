<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile | ABOSTIFY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <a class="brand" href="{{ url_for('dashboard') }}">ABOSTIFY</a>
        <h1>Edit your profile</h1>
        <p>Tell the community a little about yourself.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="display_name">Display name</label>
            <input id="display_name" name="display_name"
                   maxlength="60"
                   value="{{ user.display_name or '' }}">

            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="300"
                      rows="4">{{ user.bio or '' }}</textarea>

            <label for="location">Location</label>
            <input id="location" name="location" maxlength="100"
                   value="{{ user.location or '' }}">

            <label for="website">Website</label>
            <input id="website" name="website" type="text"
                   maxlength="200" placeholder="https://example.com"
                   value="{{ user.website or '' }}">

            <button class="auth-button" type="submit">Save Profile</button>
        </form>

        <p class="auth-footer">
            <a href="{{ url_for('profiles.view', username=user.username) }}">
                View my profile
            </a>
        </p>
    </section>
</main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
